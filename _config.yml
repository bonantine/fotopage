# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Antoine Boniface
email: antoine.boniface@domain.com
description: "Galleries photographiques"
baseurl: "/fotopage" # the subpath of your site, e.g. /blog
url: "https://bonantine.github.io" # the base hostname & protocol for your site
github_username:  bonantine

# Build settings
markdown: kramdown

defaults:
  -
    scope:
      path: "photography"
    values:
      permalink: /:path/:basename:output_ext

exclude: [LICENSE-CODE.md, README.md]
