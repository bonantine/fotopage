en:
  nav_about: About
  nav_portfolio: Portfolio
  about_text: >
    Photography, for me, begins where words are no longer enough.
    It is a way of holding onto an emotion, a silence, a fleeting presence.
    I feel particularly attuned to its artistic language, to the delicate
    search for balance, harmony, and emotion within each frame. More than
    simply creating images, I try to capture what can be felt, and perhaps
    allow that feeling to resonate beyond myself.
fr:
  nav_about: À propos
  nav_portfolio: Portfolio
  about_text: >
    La photographie, pour moi, commence là où les mots ne suffisent plus.
    Elle est une manière de retenir une émotion, un silence, une présence
    fugace. Je me sens particulièrement sensible à son langage artistique,
    à la recherche délicate d'équilibre, d'harmonie et d'émotion dans chaque
    image. Plus que de simplement créer des images, je cherche à capturer
    ce qui se ressent, et peut-être à laisser cette émotion résonner
    au-delà de moi.
